<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-label="speak-up demo: a Korean reply is read in a Korean voice and stops when a key is pressed; a Spanish reply is read in a Spanish voice">
  <style>
    .t { font-family: ui-monospace, "Cascadia Code", Consolas, "Malgun Gothic", "Apple SD Gothic Neo", monospace; font-size: 15px; fill: #e6e6e6; }
    .dim { fill: #8b949e; }
    .you { fill: #79c0ff; }
    .badge-t { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 13px; font-weight: 600; }
    .cap { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 12px; fill: #8b949e; }

    /* 10 s loop: scene A 0-50 %, scene B 50-100 % */
    .sceneA { animation: sceneA 10s infinite; }
    .sceneB { animation: sceneB 10s infinite; opacity: 0; }
    @keyframes sceneA { 0%, 48% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes sceneB { 0%, 50% { opacity: 0 } 52%, 98% { opacity: 1 } 100% { opacity: 0 } }

    .replyA { animation: replyA 10s infinite; opacity: 0; }
    @keyframes replyA { 0%, 6% { opacity: 0 } 9%, 100% { opacity: 1 } }
    .replyB { animation: replyB 10s infinite; opacity: 0; }
    @keyframes replyB { 0%, 56% { opacity: 0 } 59%, 100% { opacity: 1 } }

    /* speaking indicator */
    .speakA { animation: speakA 10s infinite; opacity: 0; }
    @keyframes speakA { 0%, 11% { opacity: 0 } 13%, 34% { opacity: 1 } 35%, 100% { opacity: 0 } }
    .stoppedA { animation: stoppedA 10s infinite; opacity: 0; }
    @keyframes stoppedA { 0%, 34% { opacity: 0 } 35%, 48% { opacity: 1 } 50%, 100% { opacity: 0 } }
    .speakB { animation: speakB 10s infinite; opacity: 0; }
    @keyframes speakB { 0%, 61% { opacity: 0 } 63%, 96% { opacity: 1 } 98%, 100% { opacity: 0 } }

    .bar { transform-box: fill-box; transform-origin: center; animation: wave 0.6s ease-in-out infinite alternate; }
    .b2 { animation-delay: -0.15s } .b3 { animation-delay: -0.3s } .b4 { animation-delay: -0.45s } .b5 { animation-delay: -0.2s }
    @keyframes wave { from { transform: scaleY(0.25) } to { transform: scaleY(1) } }

    /* key press */
    .key { animation: key 10s infinite; opacity: 0; }
    @keyframes key { 0%, 31% { opacity: 0 } 32%, 46% { opacity: 1 } 48%, 100% { opacity: 0 } }
    .keyface { animation: press 10s infinite; }
    @keyframes press { 0%, 33% { transform: translateY(0) } 34%, 36% { transform: translateY(3px) } 37%, 100% { transform: translateY(0) } }

    @media (prefers-reduced-motion: reduce) {
      .bar { animation: none; }
    }
  </style>

  <!-- window -->
  <rect x="0.5" y="0.5" width="759" height="329" rx="10" fill="#0d1117" stroke="#30363d"/>
  <rect x="0.5" y="0.5" width="759" height="34" rx="10" fill="#161b22"/>
  <rect x="0.5" y="24" width="759" height="11" fill="#161b22"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="380" y="22" text-anchor="middle" class="cap">Claude Code + speak-up</text>

  <!-- Scene A: Korean, stopped by a key press -->
  <g class="sceneA">
    <text x="28" y="72" class="t you">&gt; 오늘 할 일 정리해줘</text>
    <g class="replyA">
      <text x="28" y="108" class="t">● 오늘 할 일은 세 가지예요.</text>
      <text x="44" y="132" class="t">첫째, 테스트를 돌리고 둘째, README를 고치고</text>
      <text x="44" y="156" class="t dim">셋째, 배포 전에 한 번 더 확인해요.</text>
    </g>

    <g class="speakA">
      <rect x="28" y="196" width="250" height="34" rx="17" fill="#1f6feb" opacity="0.18"/>
      <g fill="#58a6ff">
        <rect class="bar" x="44" y="203" width="4" height="20" rx="2"/>
        <rect class="bar b2" x="52" y="203" width="4" height="20" rx="2"/>
        <rect class="bar b3" x="60" y="203" width="4" height="20" rx="2"/>
        <rect class="bar b4" x="68" y="203" width="4" height="20" rx="2"/>
        <rect class="bar b5" x="76" y="203" width="4" height="20" rx="2"/>
      </g>
      <text x="92" y="218" class="badge-t" fill="#58a6ff">Speaking · Korean voice</text>
    </g>

    <g class="stoppedA">
      <rect x="28" y="196" width="250" height="34" rx="17" fill="#8b949e" opacity="0.15"/>
      <rect x="45" y="206" width="14" height="14" rx="2" fill="#c9d1d9"/>
      <text x="70" y="218" class="badge-t" fill="#c9d1d9">Stopped</text>
    </g>

    <g class="key">
      <g class="keyface">
        <rect x="318" y="190" width="120" height="46" rx="8" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
        <text x="378" y="219" text-anchor="middle" class="badge-t" fill="#e6e6e6">any key</text>
      </g>
      <text x="456" y="218" class="badge-t" fill="#f0883e">→ speech stops at once</text>
    </g>
  </g>

  <!-- Scene B: Spanish, voice switches automatically -->
  <g class="sceneB">
    <text x="28" y="72" class="t you">&gt; ¿Puedes revisar este archivo?</text>
    <g class="replyB">
      <text x="28" y="108" class="t">● Claro. Revisé el archivo y encontré dos errores.</text>
      <text x="44" y="132" class="t">Ya los corregí y las pruebas pasan.</text>
      <text x="44" y="156" class="t dim">¿Quieres que suba los cambios?</text>
    </g>
    <g class="speakB">
      <rect x="28" y="196" width="250" height="34" rx="17" fill="#238636" opacity="0.2"/>
      <g fill="#3fb950">
        <rect class="bar" x="44" y="203" width="4" height="20" rx="2"/>
        <rect class="bar b2" x="52" y="203" width="4" height="20" rx="2"/>
        <rect class="bar b3" x="60" y="203" width="4" height="20" rx="2"/>
        <rect class="bar b4" x="68" y="203" width="4" height="20" rx="2"/>
        <rect class="bar b5" x="76" y="203" width="4" height="20" rx="2"/>
      </g>
      <text x="92" y="218" class="badge-t" fill="#3fb950">Speaking · Spanish voice</text>
      <text x="300" y="218" class="badge-t" fill="#8b949e">language detected automatically</text>
    </g>
  </g>

  <text x="380" y="300" text-anchor="middle" class="cap">Illustration. speak-up has no visual output; it plays the reply as sound.</text>
</svg>
